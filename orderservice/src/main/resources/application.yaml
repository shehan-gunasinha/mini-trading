server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  autoconfigure:
    exclude:
      - org.infinispan.spring.starter.embedded.InfinispanEmbeddedAutoConfiguration
      - org.infinispan.spring.starter.embedded.InfinispanEmbeddedCacheManagerAutoConfiguration


  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

grpc:
  server:
    port: 9090

kafka:
  topics:
    order-created: order.created
    order-updated: order.updated
    order-deleted: order.deleted


cache:
  orders:
    max-entries: 100 #maximum number od orders to cache
    ttl-seconds: 300 #expire after 5 min

  orders-list:
    max-entries: 10 #cache 10 maximum lists
    ttl-seconds: 60

logging:
  level:
    com.example.orderservice: DEBUG